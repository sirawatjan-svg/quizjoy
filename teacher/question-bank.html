<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>คลังข้อสอบ — Interactive Video Quizjoy</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    .bank-layout { max-width: 720px; margin: 0 auto; padding: 24px; text-align: left; }
    .q-form input, .q-form textarea { width: 100%; margin-bottom: 8px; }
    .q-list-item { background: var(--panel); border-radius: 12px; padding: 12px; margin-bottom: 8px; border: 2px solid transparent; }
    .q-list-item .row { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
    .q-list-item .del-btn, .q-list-item .edit-btn { flex-shrink:0; padding:6px 12px; font-size:0.8rem; }
    .q-list-item .del-btn { background: var(--wrong); }
    .q-list-item .edit-btn { background: var(--accent); }
    /* กล่องที่กำลังแก้ไขอยู่ตอนนี้ (ฟอร์มซ้ายเติมข้อมูลของมันอยู่) ไฮไลต์กรอบให้เห็นชัดว่าแก้ข้อไหนอยู่ */
    .q-list-item.editing { border-color: var(--accent); }
    .tag { display:inline-block; background: var(--accent); border-radius: 999px; padding: 2px 10px; font-size: 0.75rem; margin-right:6px; }
    .opt-line { color: var(--muted); font-size: 0.85rem; margin: 2px 0; }
    .opt-line.correct { color: var(--correct); font-weight: 600; }

    /* --- เลย์เอาต์เดสก์ท็อป --- เดิมหน้านี้จำกัดความกว้างไว้แค่ 720px แบบ mobile-first แม้เปิดจาก
       โน้ตบุ๊กก็ตาม (ครูส่วนใหญ่เปิดหน้าจัดการคลังข้อสอบจากคอมเป็นหลัก) เลยขยายเฉพาะจอกว้าง: ฟอร์ม
       เพิ่มคำถามอยู่ซ้าย (แคบ ไม่ต้องยืด) รายการคำถามในคลังอยู่ขวา (กว้าง ไหล 2 คอลัมน์) แทนที่จะ
       เรียงฟอร์ม+รายการต่อกันยาวๆ ลงมาคอลัมน์เดียวเหมือนเดิม */
    @media (min-width: 900px) {
      .bank-layout { max-width: 1100px; }
      .bank-content { display: grid; grid-template-columns: 360px 1fr; gap: 24px; align-items: start; }
      #q-list { column-count: 2; column-gap: 16px; }
      .q-list-item { break-inside: avoid-column; }
    }
  </style>
</head>
<body>
  <div class="bank-layout" id="app-content" style="display:none;">
    <a href="index.html" style="color:var(--muted)">← กลับหน้าครู</a>
    <h1>📚 คลังข้อสอบ</h1>

    <div class="bank-content">
      <!-- ครอบ q-form + bulk-panel ไว้ในคอลัมน์เดียวกัน (ซ้าย) ด้วยกัน — .bank-content เป็น grid 2 คอลัมน์
           ถ้าไม่ครอบไว้ ลูกตัวที่ 3 (bulk-panel) จะไหลไปแทรกคอลัมน์ขวาแทนตาม grid auto-flow ปกติ ดันรายการ
           คำถามในคลังตกไปแถวที่ 2 คอลัมน์ซ้ายผิดที่ไปเลย (เจอบั๊กนี้จริงตอนทดสอบด้วยตา ก่อน commit) -->
      <div class="bank-left-column">
      <div class="panel q-form">
        <h3 id="form-heading">เพิ่มคำถามใหม่</h3>
        <input id="q-subject" placeholder="วิชา/บทเรียน (เช่น สังคม ม.2 - อยุธยา)" />
        <textarea id="q-text" placeholder="คำถาม" rows="2"></textarea>
        <input id="q-opt-tl" placeholder="ตัวเลือก A (มุมซ้ายบน)" />
        <input id="q-opt-tr" placeholder="ตัวเลือก B (มุมขวาบน)" />
        <input id="q-opt-bl" placeholder="ตัวเลือก C (มุมซ้ายล่าง)" />
        <input id="q-opt-br" placeholder="ตัวเลือก D (มุมขวาล่าง)" />
        <select id="q-correct" style="width:100%; margin-bottom:8px;">
          <option value="tl">เฉลย: A</option>
          <option value="tr">เฉลย: B</option>
          <option value="bl">เฉลย: C</option>
          <option value="br">เฉลย: D</option>
        </select>
        <textarea id="q-explain" placeholder="คำอธิบายเฉลย (โชว์ตอนดูย้อนหลัง)" rows="2"></textarea>
        <button id="save-btn" style="width:100%;">บันทึกลงคลัง</button>
        <!-- โชว์เฉพาะตอนกำลังแก้ไขคำถามเดิม (กด "แก้ไข" จากรายการทางขวา) — กดยกเลิกกลับไปโหมด
             "เพิ่มคำถามใหม่" ตามปกติ ไม่บันทึกอะไรทับของเดิม -->
        <button id="cancel-edit-btn" type="button" style="width:100%; margin-top:6px; background:#334155; display:none;">
          ยกเลิกการแก้ไข
        </button>
        <p id="save-status" style="color:var(--muted); font-size:0.85rem;"></p>
      </div>

      <!-- นำเข้าหลายข้อพร้อมกัน — เดิมพิมพ์ได้ทีละข้อผ่านฟอร์มด้านบนเท่านั้น ถ้าครูเตรียมคำถามไว้ล่วงหน้า
           เป็นสิบๆ ข้อ (เช่นใน Google Docs/Sheets) จะช้ามากถ้าต้องพิมพ์ทีละข้อ ยุบไว้เป็น disclosure ปกติ
           ไม่ให้หน้าตาดูรกกว่าเดิมสำหรับครูที่ไม่ได้ใช้ฟีเจอร์นี้ -->
      <div class="panel" id="bulk-panel" style="margin-top:16px;">
        <button id="bulk-toggle-btn" type="button" style="width:100%; background:#334155;">
          📋 นำเข้าหลายข้อพร้อมกัน
        </button>
        <div id="bulk-body" style="display:none; margin-top:12px;">
          <p style="color:var(--muted); font-size:0.78rem; line-height:1.5;">
            1 บรรทัดต่อ 1 คำถาม คั่นแต่ละช่องด้วย <code>|</code> ตามลำดับนี้:<br />
            <code style="word-break:break-all;">วิชา|คำถาม|ตัวเลือกA|ตัวเลือกB|ตัวเลือกC|ตัวเลือกD|เฉลย(A/B/C/D)|คำอธิบาย(เว้นว่างได้)</code><br />
            บรรทัดว่างหรือขึ้นต้นด้วย <code>#</code> จะถูกข้ามไป (ใช้เขียนหมายเหตุได้)
          </p>
          <textarea
            id="bulk-text"
            rows="6"
            placeholder="สังคม ม.2 - อยุธยา|กรุงศรีอยุธยาก่อตั้ง พ.ศ. ใด|1893|1350|1767|2100|B|"
            style="width:100%; margin-bottom:8px; font-family:monospace; font-size:0.78rem;"
          ></textarea>
          <button id="bulk-import-btn" style="width:100%;">นำเข้าทั้งหมด</button>
          <div id="bulk-result" style="margin-top:8px; font-size:0.82rem;"></div>
        </div>
      </div>
      </div> <!-- ปิด .bank-left-column -->

      <div>
        <h3>คำถามในคลัง</h3>
        <input id="search-box" placeholder="ค้นหา / กรองตามวิชา" style="width:100%; margin-bottom:12px;" />
        <div id="q-list">
          <p style="color:var(--muted)">กำลังโหลดคลังข้อสอบ...</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      db,
      collection,
      addDoc,
      updateDoc,
      deleteDoc,
      doc,
      onSnapshot,
      serverTimestamp,
    } from "../assets/js/firebase-init.js";
    import { requireAuth } from "../assets/js/auth-guard.js";
    import { parseBulkQuestions } from "../assets/js/bulk-import.js";

    requireAuth(() => {
      document.getElementById("app-content").style.display = "block";
      init();
    });

    function init() {
    const subjectEl = document.getElementById("q-subject");
    const textEl = document.getElementById("q-text");
    const optEls = {
      tl: document.getElementById("q-opt-tl"),
      tr: document.getElementById("q-opt-tr"),
      bl: document.getElementById("q-opt-bl"),
      br: document.getElementById("q-opt-br"),
    };
    const correctEl = document.getElementById("q-correct");
    const explainEl = document.getElementById("q-explain");
    const saveBtn = document.getElementById("save-btn");
    const cancelEditBtn = document.getElementById("cancel-edit-btn");
    const formHeading = document.getElementById("form-heading");
    const saveStatus = document.getElementById("save-status");
    const listEl = document.getElementById("q-list");
    const searchBox = document.getElementById("search-box");
    const bulkToggleBtn = document.getElementById("bulk-toggle-btn");
    const bulkBody = document.getElementById("bulk-body");
    const bulkText = document.getElementById("bulk-text");
    const bulkImportBtn = document.getElementById("bulk-import-btn");
    const bulkResult = document.getElementById("bulk-result");

    let allQuestions = []; // แคชล่าสุดจาก onSnapshot ไว้ filter ฝั่ง client
    // ไม่มี id = กำลังเพิ่มคำถามใหม่ (โหมดปกติ), มี id = กำลังแก้ไขคำถามนั้นอยู่ (กด "แก้ไข" จากรายการ)
    let editingId = null;

    function optionLabel(zone) {
      return { tl: "A (บนซ้าย)", tr: "B (บนขวา)", bl: "C (ล่างซ้าย)", br: "D (ล่างขวา)" }[zone];
    }

    function renderList() {
      const term = searchBox.value.trim().toLowerCase();
      const filtered = term
        ? allQuestions.filter(
            (q) => q.subject.toLowerCase().includes(term) || q.text.toLowerCase().includes(term)
          )
        : allQuestions;

      if (filtered.length === 0) {
        listEl.innerHTML = `<p style="color:var(--muted)">${
          allQuestions.length === 0 ? "ยังไม่มีคำถามในคลัง — เพิ่มข้อแรกได้ด้านบน" : "ไม่พบคำถามที่ตรงกับคำค้นหา"
        }</p>`;
        return;
      }

      listEl.innerHTML = filtered
        .map(
          (q) => `
        <div class="q-list-item${q.id === editingId ? " editing" : ""}" data-id="${q.id}">
          <div class="row">
            <div>
              <span class="tag">${q.subject}</span>
              <p style="margin:6px 0 4px;">${q.text}</p>
              ${Object.entries(q.options)
                .map(
                  ([zone, text]) =>
                    `<div class="opt-line ${zone === q.correctZone ? "correct" : ""}">${optionLabel(
                      zone
                    )}: ${text}${zone === q.correctZone ? " ✓" : ""}</div>`
                )
                .join("")}
            </div>
            <div style="display:flex; flex-direction:column; gap:6px; flex-shrink:0;">
              <button class="edit-btn" data-id="${q.id}">แก้ไข</button>
              <button class="del-btn" data-id="${q.id}">ลบ</button>
            </div>
          </div>
        </div>`
        )
        .join("");

      listEl.querySelectorAll(".edit-btn").forEach((btn) => {
        btn.addEventListener("click", () => startEdit(btn.dataset.id));
      });

      listEl.querySelectorAll(".del-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("ลบคำถามนี้ออกจากคลังถาวร?")) return;
          if (btn.dataset.id === editingId) cancelEdit(); // กำลังแก้ไขข้อนี้อยู่พอดีแล้วดันลบทิ้ง — เคลียร์ฟอร์มกันค้าง
          await deleteDoc(doc(db, "questionBank", btn.dataset.id));
        });
      });
    }

    // เดิมหน้านี้แก้คำถามที่บันทึกไปแล้วไม่ได้เลย ต้องลบทิ้งแล้วพิมพ์ใหม่ทั้งข้อ (เสีย id เดิม/createdAt เดิม
    // ไปด้วย) — เพิ่มโหมด "แก้ไข" โดยใช้ฟอร์มเดียวกับ "เพิ่มคำถามใหม่" นี่แหละ แค่สลับโหมดตอนกด "แก้ไข"
    function startEdit(id) {
      const q = allQuestions.find((item) => item.id === id);
      if (!q) return;
      editingId = id;
      subjectEl.value = q.subject ?? "";
      textEl.value = q.text ?? "";
      optEls.tl.value = q.options?.tl ?? "";
      optEls.tr.value = q.options?.tr ?? "";
      optEls.bl.value = q.options?.bl ?? "";
      optEls.br.value = q.options?.br ?? "";
      correctEl.value = q.correctZone ?? "tl";
      explainEl.value = q.explanation ?? "";

      formHeading.textContent = "✏️ กำลังแก้ไขคำถาม";
      saveBtn.textContent = "บันทึกการแก้ไข";
      cancelEditBtn.style.display = "block";
      saveStatus.textContent = "";
      renderList(); // รีเฟรชให้กล่องที่กำลังแก้ไขไฮไลต์ (ดู .q-list-item.editing ใน CSS)
      document.querySelector(".q-form").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    // clearStatus: false ใช้ตอนเรียกจากปุ่ม "บันทึกการแก้ไข" ที่สำเร็จแล้ว (อยากให้ข้อความ "✅ บันทึกการ
    // แก้ไขแล้ว" ยังค้างให้เห็นต่อ ไม่ใช่ถูกเคลียร์ทิ้งทันทีที่ฟอร์มรีเซ็ตกลับไปโหมดเพิ่มคำถามใหม่)
    function cancelEdit({ clearStatus = true } = {}) {
      editingId = null;
      subjectEl.value = "";
      textEl.value = "";
      optEls.tl.value = optEls.tr.value = optEls.bl.value = optEls.br.value = "";
      correctEl.value = "tl";
      explainEl.value = "";
      formHeading.textContent = "เพิ่มคำถามใหม่";
      saveBtn.textContent = "บันทึกลงคลัง";
      cancelEditBtn.style.display = "none";
      if (clearStatus) saveStatus.textContent = "";
      renderList();
    }

    cancelEditBtn.addEventListener("click", () => cancelEdit());

    bulkToggleBtn.addEventListener("click", () => {
      bulkBody.style.display = bulkBody.style.display === "none" ? "block" : "none";
    });

    // นำเข้าหลายข้อพร้อมกัน — parseBulkQuestions() (assets/js/bulk-import.js) แยก parsing ล้วนๆ ออกไปแล้ว
    // (ทดสอบเองแยกต่างหากได้ที่ test/bulk-import-selftest.html) ที่นี่แค่เรียกใช้แล้วยิง addDoc ทีละข้อ —
    // ใช้ลูป sequential ธรรมดา ไม่ใช่ Firestore batch write เพราะจำนวนคำถามต่อครั้งในคลังขนาดนี้ (ไม่กี่สิบ
    // ข้อ) ไม่คุ้มความซับซ้อนเพิ่ม แถมได้ผลลัพธ์ "สำเร็จบางข้อ พลาดบางข้อ" แยกกันชัดเจนกว่า batch (batch ปกติ
    // เป็น all-or-nothing)
    bulkImportBtn.addEventListener("click", async () => {
      const { valid, errors } = parseBulkQuestions(bulkText.value);
      if (valid.length === 0 && errors.length === 0) {
        bulkResult.innerHTML = '<p style="color:var(--muted)">ยังไม่ได้วางข้อความอะไรเลย</p>';
        return;
      }

      bulkImportBtn.disabled = true;
      bulkResult.innerHTML = `<p style="color:var(--muted)">กำลังนำเข้า ${valid.length} ข้อ...</p>`;

      let successCount = 0;
      const writeErrors = [];
      for (const q of valid) {
        try {
          await addDoc(collection(db, "questionBank"), { ...q, createdAt: serverTimestamp() });
          successCount += 1;
        } catch (err) {
          writeErrors.push(err.message);
        }
      }

      const parts = [];
      if (successCount > 0) {
        parts.push(`<p style="color:var(--correct); margin:4px 0;">✅ นำเข้าสำเร็จ ${successCount} ข้อ</p>`);
      }
      if (errors.length > 0) {
        parts.push(
          `<p style="color:var(--wrong); margin:4px 0;">⚠️ ข้ามไป ${errors.length} บรรทัดที่รูปแบบผิด (แก้ในกล่องข้อความแล้วกดนำเข้าใหม่ได้):</p>` +
            `<ul style="margin:2px 0 4px; padding-left:20px; color:var(--wrong); font-size:0.78rem;">` +
            errors.map((e) => `<li>บรรทัดที่ ${e.line}: ${e.message}</li>`).join("") +
            `</ul>`
        );
      }
      if (writeErrors.length > 0) {
        parts.push(
          `<p style="color:var(--wrong); margin:4px 0;">❌ บันทึกไม่สำเร็จ ${writeErrors.length} ข้อ: ${writeErrors.join(", ")}</p>`
        );
      }
      bulkResult.innerHTML = parts.join("");

      // เคลียร์กล่องข้อความเฉพาะตอนนำเข้าสำเร็จอย่างน้อย 1 ข้อ — ถ้าพลาดหมดทุกบรรทัดให้ข้อความเดิมค้างไว้
      // จะได้แก้ไขแล้วลองนำเข้าใหม่ได้เลย ไม่ต้องพิมพ์ใหม่ทั้งหมด
      if (successCount > 0) bulkText.value = "";
      bulkImportBtn.disabled = false;
    });

    onSnapshot(
      collection(db, "questionBank"),
      (snap) => {
        allQuestions = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        allQuestions.sort((a, b) => (b.createdAt?.seconds ?? 0) - (a.createdAt?.seconds ?? 0));
        renderList();
      },
      (err) => {
        listEl.innerHTML = `<p style="color:var(--wrong)">โหลดคลังข้อสอบไม่สำเร็จ: ${err.message}</p>`;
      }
    );

    searchBox.addEventListener("input", renderList);

    saveBtn.addEventListener("click", async () => {
      const subject = subjectEl.value.trim();
      const text = textEl.value.trim();
      const options = {
        tl: optEls.tl.value.trim(),
        tr: optEls.tr.value.trim(),
        bl: optEls.bl.value.trim(),
        br: optEls.br.value.trim(),
      };
      const correctZone = correctEl.value;
      const explanation = explainEl.value.trim();

      if (!subject || !text || Object.values(options).some((v) => !v)) {
        saveStatus.textContent = "⚠️ กรอกให้ครบ: วิชา, คำถาม, และตัวเลือกทั้ง 4 ข้อ";
        return;
      }

      saveBtn.disabled = true;
      saveStatus.textContent = editingId ? "กำลังบันทึกการแก้ไข..." : "กำลังบันทึก...";
      try {
        if (editingId) {
          // แก้ไขคำถามเดิม — updateDoc ทับเฉพาะฟิลด์เหล่านี้ ไม่แตะ createdAt เดิม (ลำดับ "ล่าสุดก่อน" ใน
          // รายการยังอิงจากวันที่สร้างจริง ไม่ใช่วันที่แก้ล่าสุด) เติม updatedAt ไว้เผื่ออยากรู้ว่าแก้เมื่อไหร่
          await updateDoc(doc(db, "questionBank", editingId), {
            subject,
            text,
            options,
            correctZone,
            explanation,
            updatedAt: serverTimestamp(),
          });
          cancelEdit({ clearStatus: false }); // กลับไปโหมด "เพิ่มคำถามใหม่" ตามปกติ ไม่ต้องกดยกเลิกเอง
          saveStatus.textContent = "✅ บันทึกการแก้ไขแล้ว";
        } else {
          await addDoc(collection(db, "questionBank"), {
            subject,
            text,
            options,
            correctZone,
            explanation,
            createdAt: serverTimestamp(),
          });
          saveStatus.textContent = "✅ บันทึกแล้ว";
          textEl.value = "";
          optEls.tl.value = optEls.tr.value = optEls.bl.value = optEls.br.value = "";
          explainEl.value = "";
          // subject คงไว้ตั้งใจ เพราะครูมักเพิ่มหลายข้อติดกันในวิชา/บทเดียวกัน
        }
      } catch (err) {
        saveStatus.textContent = `❌ บันทึกไม่สำเร็จ: ${err.message}`;
      } finally {
        saveBtn.disabled = false;
      }
    });
    } // ปิด init()
