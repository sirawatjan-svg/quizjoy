<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>เข้าสู่ระบบครู — Interactive Video Quizjoy</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <div class="screen">
    <h1>👩‍🏫 เข้าสู่ระบบครู</h1>

    <div class="panel">
      <input id="email" type="email" placeholder="อีเมล" style="width:100%; margin-bottom:8px;" autocomplete="username" />
      <input id="password" type="password" placeholder="รหัสผ่าน" style="width:100%; margin-bottom:12px;" autocomplete="current-password" />
      <button id="submit-btn" style="width:100%;">เข้าสู่ระบบ</button>
      <p id="status" style="color:var(--muted); font-size:0.85rem;"></p>
    </div>
  </div>

  <script type="module">
    import { auth, onAuthStateChanged, signInWithEmailAndPassword } from "../assets/js/firebase-init.js";

    const emailEl = document.getElementById("email");
    const passwordEl = document.getElementById("password");
    const submitBtn = document.getElementById("submit-btn");
    const statusEl = document.getElementById("status");

    // ถ้า login ค้างอยู่แล้ว (เช่นเปิดหน้านี้ผิด) ส่งกลับไปหน้าครูเลย
    onAuthStateChanged(auth, (user) => {
      if (user) location.href = "index.html";
    });

    submitBtn.addEventListener("click", async () => {
      const email = emailEl.value.trim();
      const password = passwordEl.value;

      if (!email || !password) {
        statusEl.textContent = "⚠️ กรอกอีเมลและรหัสผ่าน";
        return;
      }

      submitBtn.disabled = true;
      statusEl.textContent = "กำลังเข้าสู่ระบบ...";

      try {
        await signInWithEmailAndPassword(auth, email, password);
        location.href = "index.html";
      } catch (err) {
        const messages = {
          "auth/invalid-credential": "อีเมลหรือรหัสผ่านไม่ถูกต้อง",
          "auth/user-not-found": "ไม่พบบัญชีนี้",
          "auth/wrong-password": "รหัสผ่านไม่ถูกต้อง",
          "auth/invalid-email": "รูปแบบอีเมลไม่ถูกต้อง",
          "auth/too-many-requests": "ลองผิดหลายครั้งเกินไป กรุณารอสักครู่แล้วลองใหม่",
        };
        statusEl.textContent = `❌ ${messages[err.code] || err.message}`;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
