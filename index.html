<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>เข้าห้องเรียน — Interactive Video Quizjoy</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="screen">
    <h1 class="sticker-text">🎮 Interactive Video Quizjoy</h1>
    <p style="color:var(--muted)">สแกน QR จากครูแล้วมาที่หน้านี้ กรอกชื่อเพื่อเข้าห้อง</p>

    <div class="panel">
      <div id="room-code-display" style="margin-bottom:12px; color:var(--muted)"></div>

      <!-- ช่องนี้โชว์เฉพาะตอนไม่มีรหัสห้องจาก QR (เช่น เปิดลิงก์เปล่าเอง หรือครูบอกรหัสปากเปล่า) -->
      <input id="room-code-input" type="text" placeholder="รหัสห้อง (5 ตัวอักษร)" maxlength="5"
        style="width:100%; margin-bottom:12px; text-transform:uppercase; display:none;" />

      <input id="student-name" type="text" placeholder="ชื่อของคุณ" style="width:100%; margin-bottom:12px;" />
      <button id="join-btn" style="width:100%">เข้าห้อง</button>
      <p id="join-status" style="color:var(--wrong); font-size:0.85rem; margin-top:8px;"></p>
    </div>

    <p style="color:var(--muted); font-size:0.85rem;">
      ต้องอนุญาตกล้องหน้า และ<strong>วางอุปกรณ์ตั้งไว้</strong>ให้กล้องเห็นตัวเต็มๆ ก่อนเริ่มเล่น
    </p>
  </div>

  <script type="module">
    import { db, doc, getDoc, collection, getDocs } from "./assets/js/firebase-init.js";
    import { findExistingPlayerId } from "./assets/js/rejoin.js";

    // อ่าน room code จาก query string ที่ครูฝังไว้ใน QR เช่น index.html?room=AB12
    const params = new URLSearchParams(location.search);
    let room = params.get("room");
    const display = document.getElementById("room-code-display");
    const roomInput = document.getElementById("room-code-input");
    const joinStatus = document.getElementById("join-status");
    const joinBtn = document.getElementById("join-btn");
    const nameInput = document.getElementById("student-name");

    if (room) {
      display.textContent = `ห้อง: ${room}`;
    } else {
      // ไม่มีรหัสห้องจาก QR — เปิดช่องให้พิมพ์เองแทน (เช่น ครูบอกรหัสปากเปล่า หรือ QR สแกนไม่ติด)
      display.textContent = "⚠️ ไม่พบรหัสห้องจาก QR — พิมพ์รหัสห้องที่ครูให้มาแทนได้เลย";
      roomInput.style.display = "block";
    }

    // ถ้าเพิ่งเข้าห้องเดียวกันนี้ไปก่อนหน้า (เช่น หลุด/ปิดแท็บ/แอปโดนปิดพัก แล้วกลับมาใหม่) เติมชื่อเดิม
    // ให้อัตโนมัติ — สะดวกกว่าให้พิมพ์ใหม่ทุกครั้ง ตัวจับคู่ "รู้จักคนเดิม" จริงๆ อยู่ที่ตอนกด "เข้าห้อง"
    // ด้านล่าง (เทียบชื่อกับผู้เล่นที่มีอยู่แล้วในห้อง ไม่ใช่แค่ช่วยเติมให้พิมพ์เร็วขึ้นตรงนี้)
    if (room && localStorage.getItem("quizjoy_room") === room) {
      const savedName = localStorage.getItem("quizjoy_name");
      if (savedName) nameInput.value = savedName;
    }

    joinBtn.addEventListener("click", async () => {
      const name = document.getElementById("student-name").value.trim();
      const typedRoom = roomInput.style.display !== "none" ? roomInput.value.trim().toUpperCase() : "";
      const roomCode = room || typedRoom;

      joinStatus.textContent = "";

      if (!roomCode) {
        joinStatus.textContent = "⚠️ กรุณาใส่รหัสห้อง (ขอจากครู หรือสแกน QR ใหม่)";
        return;
      }
      if (!name) {
        joinStatus.textContent = "⚠️ กรุณากรอกชื่อของคุณ";
        return;
      }

      joinBtn.disabled = true;
      joinBtn.textContent = "กำลังตรวจสอบห้อง...";

      try {
        const snap = await getDoc(doc(db, "sessions", roomCode));
        if (!snap.exists()) {
          joinStatus.textContent = `❌ ไม่พบห้อง "${roomCode}" — ตรวจสอบรหัสห้องกับครูอีกครั้ง (พิมพ์ตัวพิมพ์ใหญ่/เล็กไม่มีผล)`;
          joinBtn.disabled = false;
          joinBtn.textContent = "เข้าห้อง";
          return;
        }

        // เข้าห้องซ้ำ ("rejoin") — ถ้ามีคนเดิมชื่อนี้อยู่ในห้องนี้แล้ว (เช่น หลุดออกไปแล้วกลับมาเข้าใหม่ อาจ
        // จะคนละเครื่อง/เบราว์เซอร์ก็ได้ ไม่มีระบบ auth ให้เช็คตัวตนจริงๆ อยู่แล้ว ใช้ชื่อซ้ำเป๊ะเป็นตัวจับคู่
        // แทน) ให้ "สวมสิทธิ์" กลับเข้าไปเป็นผู้เล่นคนเดิม (ใช้ studentId เดิม) แทนที่จะสร้างคนใหม่คะแนน 0
        // ซ้ำซ้อน — ตามที่ครูขอ "อยากให้เด็กหลุดออกแล้วกลับเข้ามาเล่นต่อได้โดยไม่เสียคะแนนที่ทำไว้"
        // (ฝั่ง student/app.js เองรองรับกรณี "เข้าห้องตอนเกมเริ่มไปแล้ว" อยู่แล้วอัตโนมัติ — เห็นว่า session
        // status เป็น active ก็คำนวณเวลาที่เหลือจริงแล้วพาเข้าเกมทันที ไม่ต้องแก้เพิ่มจุดนั้น)
        const playersSnap = await getDocs(collection(db, "sessions", roomCode, "players"));
        const existingPlayers = playersSnap.docs.map((d) => ({ id: d.id, name: d.data().name }));
        const studentId = findExistingPlayerId(existingPlayers, name) ?? crypto.randomUUID();

        // localStorage แทน sessionStorage เดิม — sessionStorage หายทันทีที่ปิดแท็บ/แอป ทำให้ "หลุดแล้วกลับมา
        // เข้าใหม่" (ปิดเบราว์เซอร์ทั้งแอปแล้วเปิดใหม่ ไม่ใช่แค่รีเฟรชหน้าเดิม) ต้องพิมพ์ชื่อใหม่เสมอ ทั้งที่
        // จริงๆ ตัวจับคู่ชื่อด้านบนรองรับ rejoin ได้แล้ว — localStorage อยู่ข้ามการปิดเปิดแอปในเครื่องเดียวกัน
        // ช่วยให้ชื่อถูกเติมอัตโนมัติ (ดูโค้ดด้านบน) แม้จะปิดแอปไปแล้วก็ตาม
        localStorage.setItem("quizjoy_name", name);
        localStorage.setItem("quizjoy_room", roomCode);
        localStorage.setItem("quizjoy_studentId", studentId);
        location.href = `student/index.html?room=${encodeURIComponent(roomCode)}`;
      } catch (err) {
        joinStatus.textContent = `❌ เชื่อมต่อไม่สำเร็จ: ${err.message}`;
        joinBtn.disabled = false;
        joinBtn.textContent = "เข้าห้อง";
      }
    });
  </script>
</body>
</html>
