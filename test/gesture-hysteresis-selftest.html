<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Gesture Hysteresis Self-Test</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f1f5f9; padding: 24px; }
    #log { white-space: pre-wrap; background: #1e293b; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; }
    .ok { color: #22c55e; }
    .fail { color: #ef4444; }
  </style>
</head>
<body>
  <h1>🧪 Gesture Zone Hysteresis Self-Test</h1>
  <p>ทดสอบว่า pointToZone ไม่สั่นไปมาตรงเส้นแบ่งกลาง (ปัญหาที่ครูรายงานมา) และยังสลับโซนได้จริงเมื่อขยับไกลพอ</p>
  <div id="log">กำลังทดสอบ...</div>

  <script type="module">
    import { pointToZone, resetZoneTracking, smoothAlpha } from "../assets/js/gesture-detection.js";

    const logEl = document.getElementById("log");
    const lines = [];
    let pass = 0, fail = 0;
    function check(label, actual, expected) {
      const ok = actual === expected;
      if (ok) pass++; else fail++;
      lines.push(`${ok ? "✅" : "❌"} ${label}: ได้ "${actual}" (คาดหวัง "${expected}")`);
      logEl.innerHTML = lines.join("\n");
    }

    resetZoneTracking();

    // เริ่มที่ tl ชัดเจน
    check("จุดเริ่มต้นชัดเจนในมุม tl", pointToZone(0.3, 0.3), "tl");

    // ขยับผ่านเส้นกลาง x แค่นิดเดียว (0.51) — ควรยังนับเป็น tl เดิม (กันสั่น)
    check("ขยับผ่านเส้นกลาง x แค่ 0.01 ไม่ควรสลับโซน", pointToZone(0.51, 0.3), "tl");

    // ขยับกลับมา 0.49 — ก็ควรยังเป็น tl เหมือนเดิม (ไม่เคยสลับไปไหน)
    check("ขยับกลับมาใกล้กลางอีกฝั่ง ก็ยังไม่สลับ", pointToZone(0.49, 0.3), "tl");

    // จำลองมือสั่นแกว่งไปมาแถวเส้นกลางหลายรอบ — ต้องนิ่งเป็น tl ตลอด ไม่กระโดด
    let flickered = false;
    const jitterSequence = [0.48, 0.52, 0.49, 0.53, 0.47, 0.51, 0.48];
    const results = jitterSequence.map((x) => pointToZone(x, 0.3));
    if (results.every((z) => z === "tl")) {
      pass++;
      lines.push(`✅ จำลองมือสั่น 7 ครั้งแถวเส้นกลาง: ${JSON.stringify(results)} — นิ่งเป็น tl ตลอด ไม่กระโดด`);
    } else {
      fail++;
      lines.push(`❌ จำลองมือสั่น: ${JSON.stringify(results)} — ยังกระโดดอยู่ ไม่ผ่าน`);
    }
    logEl.innerHTML = lines.join("\n");

    // ขยับไปไกลจริงๆ (เลย margin 0.07 ทั้งสองแกนพอ) — ต้องสลับโซนได้
    check("ขยับไปมุม tr ไกลพอ ต้องสลับโซนได้จริง", pointToZone(0.7, 0.3), "tr");

    // สลับกลับไป bl (ข้ามทั้งแกน x และ y) — ต้องสลับได้
    check("ขยับข้ามไปมุม bl ไกลพอ ต้องสลับโซนได้จริง", pointToZone(0.3, 0.7), "bl");

    // ทดสอบ resetZoneTracking() ว่าเคลียร์ state จริง
    resetZoneTracking();
    check("หลัง reset แล้วชี้จุดใหม่ต้องได้โซนตาม quadrant ปกติทันที", pointToZone(0.7, 0.7), "br");

    // smoothAlpha: ต้อง "ไม่ขึ้นกับ FPS" — ตามทันตำแหน่งจริงในเวลาจริงเท่ากัน ไม่ว่าจะมีกี่เฟรมในช่วงเวลานั้น
    // (บั๊กที่เพิ่งแก้: ค่าคงที่ต่อเฟรมแบบเดิมทำให้เครื่อง FPS ต่ำตามทันช้ากว่าเครื่อง FPS สูงมาก ทั้งที่เวลา
    // จริงผ่านไปเท่ากัน — ครูส่งภาพยืนยันเจอเครื่องที่วิ่งแค่ ~7fps จริง)
    function simulateSmoothing(totalMs, fps, target) {
      const dt = 1000 / fps;
      let value = 0; // เริ่มจาก 0 ไล่ไปหา target
      let elapsed = 0;
      while (elapsed < totalMs) {
        const alpha = smoothAlpha(dt);
        value = value + (target - value) * alpha;
        elapsed += dt;
      }
      return value;
    }
    const targetPos = 1;
    const after200ms60fps = simulateSmoothing(200, 60, targetPos);
    const after200ms7fps = simulateSmoothing(200, 7, targetPos);
    // ข้อเท็จจริงที่ถูกต้องไม่ใช่ "ตามทันเท่ากันเป๊ะ" แต่คือ "เครื่อง FPS ต่ำต้องไม่มีวันตามทันช้ากว่าเครื่อง
    // FPS สูง" (จุดบกพร่องเดิมที่เพิ่งแก้คือ FPS ต่ำตามทันช้ากว่ามาก) — ที่ 7fps นั้น dt (~143ms) เกิน
    // SMOOTH_TAU_MS (90) อยู่แล้ว เลยสแนปเต็มที่ทุกเฟรม (alpha=1) ทำให้จริงๆ แล้ว "ไวกว่าหรือเท่ากับ" 60fps
    // เสมอ ไม่ใช่แค่ "พอๆ กัน" — ตรงกันข้ามกับพฤติกรรมเดิม (ค่าคงที่ต่อเฟรม) ที่ยิ่ง FPS ต่ำยิ่งตามทันช้าลง
    check(
      "smoothAlpha: 7fps ต้องตามทันตำแหน่งจริงในเวลา 200ms ไวกว่าหรือเท่ากับ 60fps เสมอ (ไม่ใช่ช้ากว่าแบบเดิม) — " +
        `60fps=${after200ms60fps.toFixed(3)} 7fps=${after200ms7fps.toFixed(3)}`,
      after200ms7fps >= after200ms60fps,
      true
    );
    check(
      "smoothAlpha: dt เกิน SMOOTH_TAU_MS (90) ต้องสแนปเต็มที่ (alpha=1) — เครื่อง FPS ต่ำมากไม่ต้องรอผสมทีละนิด",
      smoothAlpha(150),
      1
    );
    check("smoothAlpha: dt=0 ต้องไม่ขยับเลย (alpha=0)", smoothAlpha(0), 0);
    check("smoothAlpha: dt ติดลบ (เผื่อ clock เพี้ยน) ต้องไม่ทำให้ alpha ติดลบ", smoothAlpha(-50), 0);

    lines.push(`\n${fail === 0 ? "🎉" : "⚠️"} สรุป: ผ่าน ${pass}/${pass + fail}`);
    logEl.innerHTML = lines.join("\n");
    logEl.className = fail === 0 ? "ok" : "fail";
  </script>
</body>
</html>
