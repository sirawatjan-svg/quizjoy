<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Bonus Engine Self-Test</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f1f5f9; padding: 24px; }
    button { margin: 4px; padding: 8px 14px; border-radius: 8px; border: none; background: #6366f1; color: white; cursor: pointer; }
    #log { white-space: pre-wrap; background: #1e293b; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; margin-top: 16px; max-height: 70vh; overflow-y: auto; }
    .ok { color: #22c55e; }
    .fail { color: #ef4444; }
    .corner { display: none; } /* corners จริงไม่ต้องเห็น แค่ต้องมี DOM element ให้ engine ใช้งาน */
  </style>
</head>
<body>
  <h1>🧪 Bonus Engine Self-Test (จำลอง zone events แม่นยำระดับ ms)</h1>
  <div>
    <button id="btn-skibidi">Test Skibidi Dodge (perfect play)</button>
    <button id="btn-sky">Test Reach for Sky (hold hand up)</button>
    <button id="btn-bounce">Test Hand Bounce (switch sides freely, no beat)</button>
    <button id="btn-dance">Test Hand Dance Follow (perfect play)</button>
    <button id="btn-brainrot">Test Fish Swim (sweep point across play area)</button>
    <button id="btn-steal">Test Steal Bonus (hold on one target, mocked Firestore)</button>
    <button id="btn-steal-empty">Test Steal Bonus (no targets — graceful skip)</button>
    <button id="btn-coins">Test Coin Collect (sweep point across play area)</button>
    <button id="btn-all">Run All</button>
  </div>
  <div id="log">พร้อมทดสอบ...</div>

  <div class="corner" id="answer-tl"></div>
  <div class="corner" id="answer-tr"></div>
  <div class="corner" id="answer-bl"></div>
  <div class="corner" id="answer-br"></div>
  <div id="stage"></div>

  <script type="module">
    import {
      runSkibidiDodge,
      runReachForSky,
      runHandBounce,
      runHandDanceFollow,
      runFishSwim,
      runStealBonus,
      runCoinCollect,
    } from "../assets/js/bonus-engine.js";

    const logEl = document.getElementById("log");
    const lines = [];
    function log(msg, cls = "") {
      lines.push(cls ? `<span class="${cls}">${msg}</span>` : msg);
      logEl.innerHTML = lines.join("\n");
      logEl.scrollTop = logEl.scrollHeight;
    }

    const corners = {
      tl: document.getElementById("answer-tl"),
      tr: document.getElementById("answer-tr"),
      bl: document.getElementById("answer-bl"),
      br: document.getElementById("answer-br"),
    };
    const stage = document.getElementById("stage");

    function makeCtx(name) {
      let zoneHandler = null;
      let totalScore = 0;
      return {
        ctx: {
          corners,
          stage,
          setZoneHandler: (fn) => {
            zoneHandler = fn;
          },
          onScore: (delta) => {
            totalScore += delta;
            log(`  [score] +${delta} (รวม ${totalScore})`);
          },
          onEnd: () => {
            log(`✅ [${name}] จบเกม — คะแนนรวม ${totalScore}`, "ok");
          },
        },
        fireZone: (zone) => zoneHandler?.({ zone, point: zone ? { x: 0.5, y: 0.5 } : null }),
        fireY: (y) => zoneHandler?.({ zone: null, point: { x: 0.5, y } }),
        firePoint: (x, y) => zoneHandler?.({ zone: null, point: { x, y } }),
        getScore: () => totalScore,
      };
    }

    function wait(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }

    async function testSkibidi() {
      log("\n=== Skibidi Dodge: จำลองการ์ดเป้าหมาย แล้วยิง zone ทั้ง 4 พร้อมกันทุกครั้ง (จะต้องโดนเป้าเสมอ) ===");
      const { ctx, fireZone } = makeCtx("Skibidi Dodge");
      runSkibidiDodge(ctx);
      for (let i = 0; i < 6; i++) {
        await wait(150);
        // ยิงทุกโซน (ไม่รู้ว่าเป้าคือโซนไหน) แต่เกมออกแบบมาให้ยิงถูกโซนแล้วจบรอบทันที
        ["tl", "tr", "bl", "br"].forEach((z) => fireZone(z));
        await wait(300);
      }
    }

    async function testReachSky() {
      log("\n=== Reach for Sky: ยกมือค้าง (y=0.1) ต่อเนื่อง 3.2 วิ ===");
      const { ctx, fireY } = makeCtx("Reach for Sky");
      runReachForSky(ctx);
      const start = Date.now();
      const interval = setInterval(() => {
        if (Date.now() - start > 3200) {
          clearInterval(interval);
          return;
        }
        fireY(0.1); // ตำแหน่งสูง (raised)
      }, 50);
    }

    async function testHandBounce() {
      log("\n=== Hand Bounce (v3: อิสระ ไม่มี BPM/จังหวะแล้ว): ยิงสลับบน/ล่างรัวๆ ทุก 80ms — คาดว่าจะได้แต้ม\n     ทุกครั้งที่สลับฝั่งจริงและห่างจากครั้งก่อนอย่างน้อย 150ms (MIN_SWITCH_GAP_MS) เท่านั้น ===");
      const { ctx, fireZone } = makeCtx("Hand Bounce");
      runHandBounce(ctx);
      const start = Date.now();
      const interval = setInterval(() => {
        if (Date.now() - start > 10500) {
          clearInterval(interval);
          return;
        }
        fireZone("tl"); // ฝั่งขึ้น (up)
        fireZone("bl"); // ฝั่งลง (down) — ยิงสลับเร็วๆ เพื่อให้มีโอกาสตรงจังหวะบ่อยที่สุด
      }, 80);
    }

    async function testHandDanceFollow() {
      log("\n=== Hand Dance Follow (v2: สั้นลง 2-4 ท่า + badge บอกความคืบหน้า): ทดสอบ debounce logic ด้วยการยิง zone เดิมซ้ำๆ ===");
      const { ctx, fireZone } = makeCtx("Hand Dance Follow");
      runHandDanceFollow(ctx);
      // ทดสอบ debounce: ยิง zone เดิมรัวๆ ไม่ควรนับเป็นหลาย input (ยิงตอนยังอยู่ช่วงเล่นย้อนให้ดู ~2.6s แรก)
      await wait(1000);
      fireZone("tl");
      fireZone("tl");
      fireZone("tl");
      log("  (ยิง tl 3 ครั้งติด ควรถูกนับเป็น 1 input เท่านั้นถ้า debounce ทำงานถูกต้อง — ดู log คะแนน/finish ด้านบนประกอบ)");
      await wait(9000); // ปล่อยให้ safety timeout (7s หลัง accepting เริ่ม) จบเกมเอง เพราะเราไม่รู้ลำดับที่ถูกต้อง
    }

    async function testFishSwim() {
      log(
        "\n=== Fish Swim: ปลาว่ายอิสระตอนนี้ไม่ได้อยู่ที่ 4 มุมคงที่แล้ว เลยไม่รู้ตำแหน่งจริงล่วงหน้า —\n" +
          "     จำลองด้วยการกวาดจุดชี้เป็นตาราง 3x3 ทั่วพื้นที่เล่น ค้างจุดละ 650ms (นานกว่า CATCH_HOLD_MS=500ms)\n" +
          "     วนตลอด 10 วิ ควรมีโอกาสจับปลาได้อย่างน้อยบางตัว (คะแนน > 0) ไม่ใช่การยืนยัน exact ผลลัพธ์แบบเกมอื่น ==="
      );
      const { ctx, firePoint, getScore } = makeCtx("Fish Swim");
      runFishSwim(ctx);
      const xs = [0.15, 0.5, 0.85];
      const ys = [0.3, 0.5, 0.7];
      const points = [];
      xs.forEach((x) => ys.forEach((y) => points.push([x, y])));
      const DWELL_MS = 650; // นานกว่า CATCH_HOLD_MS (500ms) ในเกมจริง กันเคสกวาดผ่านไม่ทันจับ
      const start = Date.now();
      // ยิงจุดซ้ำๆ ทุก 50ms ระหว่างค้างที่จุดเดิม (จำลองเฟรมกล้องจริง ~20fps) ไม่ใช่ยิงครั้งเดียวแล้วขยับ —
      // checkCatch() ในเกมต้องถูกเรียกซ้ำที่ตำแหน่งเดิมต่อเนื่องถึงจะนับเวลา "ค้าง" สะสมได้ครบ CATCH_HOLD_MS
      const interval = setInterval(() => {
        const elapsed = Date.now() - start;
        if (elapsed > 15500) {
          // ตรง DURATION_MS ในเกมจริง (15000ms หลังปรับตามฟีดแบ็กครูว่ารอบสั้นไป) + กันชนนิดหน่อย
          clearInterval(interval);
          log(
            getScore() > 0
              ? `  (สุ่มกวาดจุดจับได้บางตัวจริง คะแนนรวม ${getScore()} > 0 — logic การจับ/สุ่มแต้ม/spawn ใหม่ทำงาน)`
              : "  ⚠️ กวาดครบแล้วยังไม่ได้คะแนนเลย ลองรันซ้ำอีกครั้ง (ตำแหน่งปลาสุ่มทุกครั้ง อาจแค่โชคไม่ดีรอบนี้)"
          );
          return;
        }
        const pointIndex = Math.floor(elapsed / DWELL_MS) % points.length;
        const [x, y] = points[pointIndex];
        firePoint(x, y);
      }, 50);
    }

    // Steal Bonus ใช้ ctx เพิ่ม 2 ตัวที่ makeCtx() ปกติไม่มี (fetchTargets/stealFrom แตะ Firestore ในแอปจริง —
    // ที่นี่ mock ทั้งคู่แทน ไม่แตะเน็ตเวิร์กจริงเลย) เลยประกอบ ctx เองแยกจาก makeCtx() ตัวเดิม
    function makeStealCtx(name, fakeTargets) {
      let zoneHandler = null;
      let totalScore = 0;
      const stealCalls = [];
      const ctx = {
        corners,
        stage,
        setZoneHandler: (fn) => {
          zoneHandler = fn;
        },
        onScore: (delta) => {
          totalScore += delta;
          log(`  [score] +${delta} (รวม ${totalScore})`);
        },
        onEnd: () => {
          log(`✅ [${name}] จบเกม — คะแนนรวม ${totalScore}`, "ok");
        },
        fetchTargets: () => Promise.resolve(fakeTargets),
        stealFrom: (targetId, amount) => {
          stealCalls.push({ targetId, amount });
          log(`  [stealFrom mock] หัก ${amount} จาก ${targetId} (ไม่แตะ Firestore จริง)`);
          return Promise.resolve();
        },
      };
      return {
        ctx,
        fireZone: (zone) => zoneHandler?.({ zone, point: zone ? { x: 0.5, y: 0.5 } : null }),
        getScore: () => totalScore,
        getStealCalls: () => stealCalls,
      };
    }

    async function testStealBonus() {
      log(
        "\n=== Steal Bonus: mock เป้าหมาย 3 คน (bonusScore 40/120/300) ชี้ค้าง tl รัวๆ ทุก 100ms จนครบ\n" +
          "     HOLD_MS (1400ms) — คาดว่าจะ steal จากเป้าหมายที่ผูกกับ tl (คนแรกในลิสต์) แล้ว onEnd ทันที ==="
      );
      const fakeTargets = [
        { id: "fake-a", name: "เด็กชายทดสอบ A", bonusScore: 40 },
        { id: "fake-b", name: "เด็กหญิงทดสอบ B", bonusScore: 120 },
        { id: "fake-c", name: "เด็กชายทดสอบ C", bonusScore: 300 },
      ];
      const { ctx, fireZone, getScore, getStealCalls } = makeStealCtx("Steal Bonus", fakeTargets);
      runStealBonus(ctx);
      await wait(100); // รอ fetchTargets() (mock, resolve เร็วแต่ยัง async หนึ่ง microtask) ก่อนเริ่มชี้
      const start = Date.now();
      const interval = setInterval(() => {
        if (Date.now() - start > 2000) {
          clearInterval(interval);
          const calls = getStealCalls();
          const ok =
            getScore() > 0 &&
            calls.length === 1 &&
            calls[0].targetId === "fake-a" &&
            calls[0].amount === getScore();
          log(
            ok
              ? `  ✅ ถูกต้อง: steal จาก fake-a (คนแรก=โซน tl) 1 ครั้งเท่านั้น คะแนนตรงกับที่ stealFrom หักไป (${getScore()})`
              : `  ⚠️ ผลไม่ตรงคาด: score=${getScore()}, stealCalls=${JSON.stringify(calls)} (ลองรันซ้ำ อาจแค่จังหวะ interval ไม่ลงตัว)`
          );
          return;
        }
        fireZone("tl");
      }, 100);
    }

    async function testStealBonusEmpty() {
      log("\n=== Steal Bonus (ไม่มีเป้าหมายเลย): fetchTargets() คืน [] — ควรจบเกมนุ่มนวล ได้ participation 20 แต้ม ===");
      const { ctx } = makeStealCtx("Steal Bonus (empty)", []);
      runStealBonus(ctx);
    }

    async function testCoinCollect() {
      log(
        "\n=== Coin Collect: เหรียญยิงขึ้นจากล่างแล้วตกกลับใน ~1-1.5 วิ (สั้นกว่าปลามาก) — จับทันทีไม่ต้องค้าง\n" +
          "     จำลองด้วยกวาดจุดชี้เป็นตาราง 5x5 หนาแน่น สลับเร็วทุก 50ms (ไม่ค้างจุดเดียวแบบตกปลา เพราะเหรียญ\n" +
          "     ไม่ต้องการ hold) ครบรอบทุก 1.25 วิ วนตลอด 15 วิ ควรมีโอกาสสอยโดนบางเหรียญ (คะแนน > 0) ==="
      );
      const { ctx, firePoint, getScore } = makeCtx("Coin Collect");
      runCoinCollect(ctx);
      const xs = [0.2, 0.35, 0.5, 0.65, 0.8];
      const ys = [0.25, 0.4, 0.55, 0.7, 0.85];
      const points = [];
      xs.forEach((x) => ys.forEach((y) => points.push([x, y])));
      const start = Date.now();
      const interval = setInterval(() => {
        const elapsed = Date.now() - start;
        if (elapsed > 15500) {
          clearInterval(interval);
          log(
            getScore() > 0
              ? `  (สุ่มกวาดจุดเก็บเหรียญได้จริง คะแนนรวม ${getScore()} > 0 — logic การจับทันที/สุ่มแต้ม/combo/spawn ทำงาน)`
              : "  ⚠️ กวาดครบแล้วยังไม่ได้คะแนนเลย ลองรันซ้ำอีกครั้ง (จังหวะเหรียญสุ่มทุกครั้ง อาจแค่โชคไม่ดีรอบนี้)"
          );
          return;
        }
        const [x, y] = points[Math.floor(elapsed / 50) % points.length];
        firePoint(x, y);
      }, 50);
    }

    document.getElementById("btn-skibidi").onclick = testSkibidi;
    document.getElementById("btn-sky").onclick = testReachSky;
    document.getElementById("btn-bounce").onclick = testHandBounce;
    document.getElementById("btn-dance").onclick = testHandDanceFollow;
    document.getElementById("btn-brainrot").onclick = testFishSwim;
    document.getElementById("btn-steal").onclick = testStealBonus;
    document.getElementById("btn-steal-empty").onclick = testStealBonusEmpty;
    document.getElementById("btn-coins").onclick = testCoinCollect;
    document.getElementById("btn-all").onclick = async () => {
      await testSkibidi();
      await wait(6000);
      await testReachSky();
      await wait(4000);
      await testHandBounce();
      await wait(11000);
      await testHandDanceFollow();
      await wait(9000);
      await testFishSwim();
      await wait(16000);
      await testStealBonus();
      await wait(2500);
      await testStealBonusEmpty();
      await wait(500);
      await testCoinCollect();
    };
  </script>
</body>
</html>
